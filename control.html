<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12051d">
<meta name="robots" content="noindex">
<title>Control de producción · Brilla & Canta</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
  .pestanas { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 0; position: sticky; top: 69px; z-index: 15; background: rgba(18,5,29,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--panel-borde); }
  .pestanas button { background: none; border: 0; color: var(--texto-suave); font: 700 .95rem var(--display); padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  .pestanas button.activa { color: var(--oro); border-bottom-color: var(--oro); }
  .barra-pantalla { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .barra-pantalla .boton.activo { outline: 3px solid var(--oro); outline-offset: 2px; }
  .dos-col { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .dos-col { grid-template-columns: 1fr; } }
  .lista-part { max-height: calc(100vh - 230px); overflow: auto; padding-right: 4px; }
  .cat-titulo { font: 800 .8rem var(--display); letter-spacing: .08em; color: var(--oro); margin: 12px 4px 6px; text-transform: uppercase; }
  .part { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
  .part:hover { background: rgba(255,255,255,.05); }
  .part.sel { border-color: rgba(245,196,81,.6); background: rgba(245,196,81,.08); }
  .part img { width: 38px; height: 47px; object-fit: cover; border-radius: 8px; }
  .part .n { flex: 1; min-width: 0; font-weight: 600; font-size: .93rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actual-cab { display: flex; gap: 16px; align-items: center; }
  .actual-cab img { width: 110px; border-radius: 14px; }
  .actual-cab h2 { font-size: 1.6rem; margin: 4px 0; }
  .pasos { display: grid; gap: 10px; margin-top: 16px; }
  .paso { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; background: rgba(0,0,0,.22); border-radius: 14px; padding: 12px 14px; }
  .paso .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); font-weight: 800; }
  .paso.hecho .num { background: var(--verde); color: #06210f; }
  .paso .t { font-weight: 700; } .paso .d { font-size: .85rem; color: var(--texto-suave); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
  .kpi { background: rgba(0,0,0,.22); border-radius: 14px; padding: 12px; }
  .kpi b { display: block; font: 800 1.6rem var(--display); color: var(--oro); font-variant-numeric: tabular-nums; }
  .kpi span { font-size: .78rem; color: var(--texto-suave); }
  .jur { display: flex; gap: 8px; flex-wrap: wrap; }
  table.tabla { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .tabla th { text-align: left; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-suave); padding: 8px 6px; border-bottom: 1px solid var(--panel-borde); position: sticky; top: 0; background: #1a0829; }
  .tabla td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
  .tabla td.n, .tabla th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tabla tr.top td:first-child { color: var(--oro); font-weight: 800; }
  .envoltura-tabla { overflow: auto; max-height: 70vh; }
  .vista-previa { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid var(--panel-borde); background: #000; }
  .vista-previa iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: grid; place-items: center; z-index: 60; padding: 16px; }
  .modal .tarjeta { max-width: 460px; width: 100%; background: #1d0a2e; }
  .qr-blanco { background: #fff; border-radius: 14px; padding: 12px; }
  .qr-blanco svg { width: 100%; height: auto; display: block; }
  .verif { font: 800 1.2rem var(--display); padding: 16px; border-radius: 14px; margin-top: 12px; }
  .verif.si { background: rgba(47,209,128,.15); color: var(--verde); }
  .verif.no { background: rgba(255,90,95,.15); color: #ffb3b5; }
  input.gigante { font: 800 2.4rem var(--display); text-align: center; letter-spacing: .2em; }
</style>
</head>
<body>
<div id="cab"></div>
<nav class="pestanas oculto" id="pestanas">
  <button data-t="vivo" class="activa">🎤 En vivo</button>
  <button data-t="resultados">🏆 Resultados</button>
  <button data-t="boletas">🎫 Boletas</button>
  <button data-t="ajustes">⚙️ Ajustes</button>
</nav>
<main class="contenedor ancho" id="app"><div class="cargando"><div><div class="giro"></div>Conectando…</div></div></main>

<script type="module">
import { fb, r, sesion, $, $$, esc, num, pct, aviso, esPermiso, foto, pad3, ahora, htmlEncabezado, vigilarConexion,
  calcularResultado, agregarVotos, compararResultados, ordenarParticipantes, CATEGORIAS, URL_BASE, conIds, puestoDe, premiadosDe } from './js/comun.js';
import { qrSVG } from './js/qr.js';

$('#cab').innerHTML = htmlEncabezado({ inicio: true });
vigilarConexion($('#conexion'));
const app = $('#app');

// ---------------- estado local ----------------
let U = null;
let invitadas = {}, historial = {}, bitacoraDatos = {};
let cfg = {}, estado = {}, part = {}, jur = {}, jurPriv = {}, jurSes = {}, boletas = {}, notas = {}, cierres = {}, pantalla = {}, registro = {}, validas = null;
let votosTodos = {};   // todos los votos del publico (solo produccion los lee)
let pestana = 'vivo', seleccionado = null;
let busquedaBoleta = '';

const partLista = () => ordenarParticipantes(part);
const nBoletas = () => Object.keys(boletas).length;

function resultadoDe(cid) {
  const esActual = cid === estado.cantanteId;
  const cierre = cierres[cid];
  // siempre se usan los votos en vivo: incluyen las calificaciones pendientes que llegan despues
  const agregado = votosTodos[cid] ? agregarVotos(votosTodos[cid]) : (esActual && estado.votacion === 'ABIERTA' ? { votos: 0, suma: 0 } : null);
  return calcularResultado({ agregado, notas: notas[cid], cierre, config: cfg, jurados: jur });
}

// ---------------- acceso ----------------
function pintarLogin(msg = '') {
  app.innerHTML = `<form class="tarjeta" id="f-login" style="max-width:420px;margin:40px auto">
    <h2>Control de producción</h2><p class="suave">Ingresa el código de administrador.</p>
    <div class="campo"><input id="codigo" type="password" autocomplete="current-password" placeholder="Código"></div>
    <button class="boton bloque">Entrar</button>
    ${msg ? `<p style="color:#ffb3b5">${esc(msg)}</p>` : ''}</form>`;
  $('#codigo').focus();
  $('#f-login').onsubmit = async (e) => {
    e.preventDefault();
    try { await fb.set(r('admins/' + U.uid), { codigo: $('#codigo').value.trim(), t: ahora() }); arrancarPanel(); }
    catch (err) { pintarLogin(esPermiso(err) ? 'Código incorrecto.' : 'Sin conexión.'); }
  };
}

// ---------------- repintado con anti-rebote ----------------
let pendiente = false;
function pintar() { if (pendiente) return; pendiente = true; setTimeout(() => { pendiente = false; pintarPestana(); sincronizarPantalla(); }, 30); }
function pintarPestana() {
  if (pestana === 'vivo') pVivo();
  else if (pestana === 'resultados') pResultados();
  else if (pestana === 'boletas') pBoletasTabla();
}
function cambiarPestana(t) {
  pestana = t; $$('#pestanas button').forEach((b) => b.classList.toggle('activa', b.dataset.t === t));
  if (t === 'vivo') { app.innerHTML = ''; pVivo(true); }
  if (t === 'resultados') { app.innerHTML = '<div id="res"></div>'; pResultados(); }
  if (t === 'boletas') pBoletas();
  if (t === 'ajustes') pAjustes();
}

// =====================================================================
//  EN VIVO
// =====================================================================
function estadoChip(p) {
  const c = cierres[p.id];
  if (p.ausente && !c && p.id !== estado.cantanteId) return '<span class="chip rojo">No asiste</span>';
  if (p.id === estado.cantanteId) return estado.votacion === 'ABIERTA' ? '<span class="chip verde">● Votando</span>' : '<span class="chip oro">En escena</span>';
  if (c) { const R = resultadoDe(p.id); return `<span class="chip ${R.completo ? 'azul' : ''}">${R.final === null ? '—' : num(R.final, 2)}</span>`; }
  return '';
}
function barraPantalla() {
  const m = pantalla.modo || 'espera';
  const b = (modo, txt, extra = '') => `<button class="boton secundario chico ${m === modo ? 'activo' : ''}" data-pant="${modo}" ${extra}>${txt}</button>`;
  return `<div class="barra-pantalla"><b style="margin-right:4px">Pantalla:</b>
    ${b('espera', '🏠 Espera / QR')}${b('escena', '🎤 En escena', estado.cantanteId ? '' : 'disabled')}
    ${b('resultado', '🏅 Resultado', estado.cantanteId ? '' : 'disabled')}
    ${b('jurados', '⚖️ Jurados')}${m === 'jurados' ? `<button class="boton secundario chico" data-accion="antJurado" ${Number((pantalla.jurados || {}).visibles || 0) ? '' : 'disabled'}>◀ Quitar último</button><button class="boton naranja chico" data-accion="sigJurado">Presentar siguiente jurado ▶</button>` : ''}
    ${b('invitada', '⭐ Artista invitada…')}
    ${b('podio', '🏆 Podio', 'disabled title="Se lanza desde la pestaña Resultados"')}${b('mensaje', '💬 Mensaje…')}</div>`;
}
function pVivo(estructura = false) {
  if (estructura || !$('#vivo')) {
    app.innerHTML = `<div id="vivo">
      <div class="tarjeta" id="vivo-barra"></div>
      <div id="vivo-general"></div>
      <div class="dos-col"><div class="tarjeta"><h3>Participantes</h3><div class="lista-part" id="vivo-lista"></div></div>
        <div><div class="tarjeta" id="vivo-actual"></div>
          <div class="tarjeta"><h3>Vista previa de la pantalla</h3><div class="vista-previa" id="previa"><iframe src="pantalla.html" title="Vista previa" tabindex="-1"></iframe></div></div></div></div></div>`;
    const ajustarPrevia = () => { const w = $('#previa')?.clientWidth; if (w) $('#previa iframe').style.transform = `scale(${w / 1920})`; };
    new ResizeObserver(ajustarPrevia).observe($('#previa')); ajustarPrevia();
    app.onclick = manejarClicVivo;
  }
  $('#vivo-barra').innerHTML = barraPantalla();
  const vg = $('#vivo-general'); const hg = tarjetaVotacionGeneral();
  if (vg.dataset.h !== hg) { vg.innerHTML = hg; vg.dataset.h = hg; conectarBotonesGeneral(vg); }
  // lista
  let html = ''; let cat = '';
  for (const p of partLista()) {
    if (p.categoria !== cat) { cat = p.categoria; html += `<div class="cat-titulo">${esc(cat)}</div>`; }
    html += `<div class="part ${seleccionado === p.id ? 'sel' : ''}" data-sel="${p.id}"><img src="${foto(p, true)}" alt="" loading="lazy">
      <div class="n">${esc(p.nombre)}</div>${estadoChip(p)}</div>`;
  }
  const lista = $('#vivo-lista'); const scroll = lista.scrollTop; lista.innerHTML = html; lista.scrollTop = scroll;
  // panel del participante
  const cid = seleccionado || estado.cantanteId;
  const p = part[cid];
  if (!p) { $('#vivo-actual').innerHTML = '<h3>Selecciona un participante de la lista</h3><p class="suave">Luego pulsa «Poner en escena».</p>'; return; }
  const esActual = cid === estado.cantanteId;
  const R = resultadoDe(cid);
  const abierta = esActual && estado.votacion === 'ABIERTA';
  const idsJ = Object.keys(jur).sort();
  const rev = pantalla.cid === cid ? (pantalla.revelado || {}) : {};
  const enResultado = pantalla.modo === 'resultado' && pantalla.cid === cid;
  $('#vivo-actual').innerHTML = `
    <div class="actual-cab"><img src="${foto(p)}" alt=""><div>
      <div>${esActual ? '<span class="chip oro">EN ESCENA</span>' : '<span class="chip">Seleccionado</span>'} <span class="chip">${esc(p.categoria)}</span></div>
      <h2>${esc(p.nombre)}</h2><div class="suave">${p.cancion ? '«' + esc(p.cancion) + '»' : 'Sin canción registrada'}${p.ciudad ? ' · ' + esc(p.ciudad) : ''}</div>
      <div style="margin-top:8px">${p.ausente
        ? '<span class="chip rojo">NO SE PRESENTÓ</span> <button class="boton secundario chico" data-accion="siAsistio">↩ Sí se presentó</button>'
        : `<button class="boton secundario chico" data-accion="noAsistio">${confirmarAusente.cid === cid && Date.now() - confirmarAusente.t < 6000 ? '¿Confirmas? Pulsa de nuevo' : '🚫 No se presentó'}</button>`}</div></div></div>
    <div class="pasos">
      <div class="paso ${esActual ? 'hecho' : ''}"><span class="num">1</span><div><div class="t">Poner en escena</div><div class="d">Aparece en la pantalla y los jurados pueden calificar.</div></div>
        <button class="boton chico" data-accion="escena" ${esActual ? 'disabled' : ''}>${esActual ? 'En escena' : 'Poner en escena'}</button></div>
      <div class="paso ${abierta || cierres[cid] ? 'hecho' : ''}"><span class="num">2</span><div><div class="t">Votación del público</div><div class="d">${abierta ? 'ABIERTA — el público está calificando.' : cierres[cid] ? `Cerrada con ${R.nVotos} votos.` : 'Ábrela durante la interpretación.'}</div></div>
        ${abierta ? (estado.quedan != null
            ? `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="chip rojo">⏳ Se cierra en ${estado.quedan} s</span><span><button class="boton rojo chico" data-accion="cerrarYa">Cerrar ya</button> <button class="boton secundario chico" data-accion="cancelarCuenta">Cancelar</button></span></div>`
            : `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><button class="boton rojo chico" data-accion="cerrar">⏳ Cerrar en ${segCuenta()} s</button><button class="boton secundario chico" data-accion="cerrarYa">Cerrar ya</button></div>`)
          : `<button class="boton verde chico" data-accion="abrir" ${esActual ? '' : 'disabled'}>${cierres[cid] ? 'Reabrir' : 'Abrir votación'}</button>`}</div>
      <div class="paso ${R.juradosRecibidos === R.nJurados && R.nJurados ? 'hecho' : ''}"><span class="num">3</span><div><div class="t">Jurado (${R.juradosRecibidos}/${R.nJurados})</div>
        <div class="jur" style="margin-top:6px">${idsJ.map((j) => `<span class="chip ${R.notasJ[j] !== null ? 'verde' : ''}">${esc(jur[j].nombre)}: ${R.notasJ[j] !== null ? num(R.notasJ[j], 1) : '…'}</span>`).join('')}</div></div>
        ${esActual ? (estado.juradoAbierto ? '<button class="boton secundario chico" data-accion="cerrarJurado">Cerrar jurado</button>' : '<button class="boton secundario chico" data-accion="abrirJurado">Reabrir jurado</button>') : '<span></span>'}</div>
      <div class="paso ${enResultado ? 'hecho' : ''}"><span class="num">4</span><div><div class="t">Resultado en pantalla</div>
        <div class="d">${enResultado && pantalla.soloPublico ? 'En pantalla: nota del público. Los jurados se revelan en el podio.' : enResultado ? 'Revela en el orden que quieras:' : 'Muestra la nota del público (los jurados se revelan en el podio).'}</div>
        ${!enResultado ? `<button class="boton secundario chico" data-accion="resultado" style="margin-top:6px" ${esActual || cierres[cid] ? '' : 'disabled'}>Revelación completa (público + jurados)</button>` : ''}
        ${enResultado && !pantalla.soloPublico ? `<div class="jur" style="margin-top:8px">
          <button class="boton chico ${rev.publico ? 'secundario' : ''}" data-rev="publico">${rev.publico ? '✓ ' : ''}Público</button>
          ${idsJ.map((j) => `<button class="boton chico ${rev[j] ? 'secundario' : ''}" data-rev="${j}" ${R.notasJ[j] === null ? 'disabled' : ''}>${rev[j] ? '✓ ' : ''}${esc(jur[j].nombre)}</button>`).join('')}
          <button class="boton naranja chico ${rev.final ? 'secundario' : ''}" data-rev="final">${rev.final ? '✓ ' : ''}Nota final</button>
          <button class="boton secundario chico" data-rev="todo">${rev.publico && rev.final && idsJ.every((j) => rev[j] || R.notasJ[j] === null) ? 'Ocultar todo' : 'Revelar todo'}</button></div>
          <div class="suave chico" style="margin-top:4px">Toca un botón marcado con ✓ para volver a ocultarlo.</div>` : ''}</div>
        <button class="boton chico" data-accion="resultadoPublico" ${esActual || cierres[cid] ? '' : 'disabled'}>${enResultado ? 'En pantalla' : 'Mostrar nota del público'}</button></div>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${R.nVotos}</b><span>votos del público (de ${nBoletas()} registrados)</span></div>
      <div class="kpi"><b>${num(R.promedio, 2)}</b><span>promedio público (pesa ${R.pesoPublico}%)</span></div>
      <div class="kpi"><b>${num(R.promJurado, 2)}</b><span>promedio jurado (pesa ${100 - R.pesoPublico}%)</span></div>
      <div class="kpi" style="outline:2px solid rgba(245,196,81,.5)"><b>${num(R.final, 2)}</b><span>nota final ${R.completo ? '' : '(parcial)'}</span></div>
    </div>`;
}
async function manejarClicVivo(e) {
  const t = e.target.closest('[data-sel],[data-accion],[data-rev],[data-pant]'); if (!t) return;
  try {
    if (t.dataset.sel) { seleccionado = t.dataset.sel; pVivo(); return; }
    if (t.dataset.pant) return cambiarModoPantalla(t.dataset.pant);
    const cid = seleccionado || estado.cantanteId;
    const a = t.dataset.accion;
    if (a === 'escena') await ponerEnEscena(cid);
    if (a === 'abrir') { await fb.update(r('estado'), { votacion: 'ABIERTA' }); await fb.update(r('pantalla'), { modo: 'escena', cid: estado.cantanteId }); await fb.update(r('historial/' + estado.cantanteId), { abierta: ahora() }); aviso('Votación del público ABIERTA'); }
    if (a === 'cerrar') iniciarCuenta();
    if (a === 'cerrarYa') { await cerrarVotacion(); aviso('Votación cerrada'); }
    if (a === 'cancelarCuenta') { pararCuenta(); await fb.update(r(''), { 'estado/quedan': null, 'pantalla/vivo/quedan': null }); aviso('Cuenta regresiva cancelada: la votación sigue abierta'); }
    if (a === 'cerrarJurado') await fb.update(r('estado'), { juradoAbierto: false });
    if (a === 'abrirJurado') await fb.update(r('estado'), { juradoAbierto: true });
    if (a === 'resultado') await mostrarResultado(cid, false);
    if (a === 'resultadoPublico') await mostrarResultado(cid, true);
    if (a === 'antJurado') await fb.update(r('pantalla/jurados'), { visibles: Math.max(0, Number((pantalla.jurados || {}).visibles || 0) - 1) });
    if (a === 'noAsistio' || a === 'siAsistio') {
      if (a === 'noAsistio' && !(confirmarAusente.cid === cid && Date.now() - confirmarAusente.t < 6000)) { confirmarAusente = { cid, t: Date.now() }; pintar(); setTimeout(pintar, 6100); return; }
      confirmarAusente = {};
      await fb.update(r('participantes/' + cid), { ausente: a === 'noAsistio' ? true : null });
      bitacora(`${a === 'noAsistio' ? 'No se presentó' : 'Se marcó de nuevo como presente'}: ${part[cid].nombreCompleto || part[cid].nombre} (${part[cid].categoria})`);
      aviso(a === 'noAsistio' ? 'Marcado: no se presentó' : 'Marcado de nuevo como presente');
    }
    if (a === 'sigJurado') {
      const n = Math.min(Object.keys(jur).length, Number((pantalla.jurados || {}).visibles || 0) + 1);
      await fb.update(r('pantalla/jurados'), { visibles: n });
      const j = Object.entries(jur).find(([, x]) => Number(x.orden) === n); if (j) bitacora('Presentación del jurado: ' + j[1].nombre);
    }
    if (t.dataset.rev) {
      const k = t.dataset.rev;
      const rv = pantalla.revelado || {};
      if (k === 'todo') {
        const R0 = resultadoDe(pantalla.cid || estado.cantanteId);
        const todo = rv.publico && rv.final && Object.keys(jur).every((j) => rv[j] || R0.notasJ[j] === null);
        const o = { publico: !todo, final: !todo }; Object.keys(jur).forEach((j) => (o[j] = !todo));
        await fb.update(r('pantalla/revelado'), o);
      } else await fb.update(r('pantalla/revelado'), { [k]: !rv[k] });   // revelar / ocultar
      sincronizarPantalla(0);
    }
  } catch (err) { aviso('No se pudo: ' + (esPermiso(err) ? 'sin permiso' : 'sin conexión'), 'error'); }
}
async function ponerEnEscena(cid) {
  if (estado.votacion === 'ABIERTA' && estado.cantanteId && estado.cantanteId !== cid) await cerrarVotacion();
  await fb.update(r('estado'), { cantanteId: cid, votacion: 'CERRADA', juradoAbierto: true, t: ahora() });
  await fb.update(r('pantalla'), { modo: 'escena', cid, revelado: null });
  await fb.update(r('historial/' + cid), { escena: ahora() });
  bitacora(`En escena: ${part[cid].nombreCompleto || part[cid].nombre} (${part[cid].categoria})`);
  seleccionado = cid;
  aviso('En escena: ' + part[cid].nombre);
}
// ---- cuenta regresiva: avisa al publico (pantalla y celulares) antes de cerrar ----
let cuentaTimer = null;
let confirmarAusente = {};   // doble pulsacion para «No se presentó»
const segCuenta = () => Math.max(3, Math.min(60, Number(cfg.cuentaSeg) || 15));
function pararCuenta() { clearInterval(cuentaTimer); cuentaTimer = null; }
function iniciarCuenta() {
  if (cuentaTimer) return;
  const cid = estado.cantanteId; let n = segCuenta();
  fb.update(r(''), { 'estado/quedan': n, 'pantalla/vivo/quedan': n });
  bitacora(`Cuenta regresiva de ${n} s para cerrar la votación`);
  cuentaTimer = setInterval(async () => {
    n -= 1;
    if (estado.cantanteId !== cid || estado.votacion !== 'ABIERTA') { pararCuenta(); return; }
    if (n > 0) { fb.update(r(''), { 'estado/quedan': n, 'pantalla/vivo/quedan': n }).catch(() => {}); return; }
    pararCuenta();
    try { await cerrarVotacion(); aviso('Votación cerrada'); } catch (e) { aviso('No se pudo cerrar: revisa la conexión', 'error'); }
  }, 1000);
}
async function cerrarVotacion() {
  const cid = estado.cantanteId; if (!cid) return;
  pararCuenta();
  await fb.update(r(''), { 'estado/votacion': 'CERRADA', 'estado/quedan': null, 'pantalla/vivo/quedan': null });
  await new Promise((ok) => setTimeout(ok, 1500));    // deja llegar los ultimos votos en camino
  const s = await fb.get(r('votos/' + cid));          // lectura definitiva despues de cerrar
  const agg = agregarVotos(s.val());
  await fb.update(r('historial/' + cid), { cierre: ahora() });
  await fb.set(r('cierres/' + cid), { boletas: nBoletas(), votos: agg.votos, suma: agg.suma, t: ahora() });
  // desde ahora queda en la lista de «calificaciones pendientes» de los celulares
  await fb.update(r(''), { ['presentados/' + cid]: true, 'estado/presentadosV': ahora() });
}

let confirmarCierreTotal = 0;
async function cerrarTodasLasVotaciones() {
  if (Date.now() - confirmarCierreTotal > 6000) { confirmarCierreTotal = Date.now(); aviso('Pulsa de nuevo en los próximos 6 segundos para cerrar TODAS las votaciones del público', 'error', 6000); return; }
  confirmarCierreTotal = 0;
  pararCuenta();
  await fb.update(r(''), { 'estado/votacionGeneral': false, 'estado/votacion': 'CERRADA', 'estado/quedan': null, 'pantalla/vivo/quedan': null });
  await new Promise((ok) => setTimeout(ok, 1500));   // deja llegar los ultimos votos en camino
  const todos = (await fb.get(r('votos'))).val() || {};
  const upd = {};
  for (const [cid, vs] of Object.entries(todos)) { const a = agregarVotos(vs); upd['cierres/' + cid] = { boletas: nBoletas(), votos: a.votos, suma: a.suma, t: ahora(), final: true }; }
  if (Object.keys(upd).length) await fb.update(r(''), upd);
  bitacora('Cierre definitivo de las votaciones del público');
  aviso('Todas las votaciones del público quedaron cerradas. Las notas del público ya son definitivas.');
}

// ---------------- datos que la pantalla necesita (solo lo ya revelado) ----------------
function construirResultado(cid, rev, soloPublico) {
  const R = resultadoDe(cid);
  if (soloPublico) return { cid, soloPublico: true, parcial: estado.votacionGeneral === true, publico: { nota: R.promedio, votos: R.nVotos }, revelado: { publico: true } };
  return {
    cid,
    publico: rev.publico ? { nota: R.promedio, votos: R.nVotos } : null,
    jurados: Object.keys(jur).sort().map((j) => ({ id: j, nombre: jur[j].nombre || j, nota: rev[j] && R.notasJ[j] !== null ? R.notasJ[j] : null })),
    final: rev.final ? R.final : null,
    revelado: rev,
  };
}
async function mostrarResultado(cid, soloPublico = true) {
  if (!cid || !part[cid]) return;
  ultimaSync = '';
  await fb.update(r('pantalla'), { modo: 'resultado', cid, soloPublico, revelado: soloPublico ? { publico: true } : null, resultado: construirResultado(cid, soloPublico ? { publico: true } : {}, soloPublico) });
}
let ultimaSync = '', syncTimer = null;
function sincronizarPantalla(espera = 700) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    const cid = pantalla.cid || estado.cantanteId;
    const act = estado.cantanteId;
    const Ra = act ? resultadoDe(act) : null;
    const vivo = { boletas: nBoletas(), votos: Ra ? Ra.nVotos : 0, abierta: estado.votacion === 'ABIERTA', quedan: estado.votacion === 'ABIERTA' && estado.quedan != null ? estado.quedan : null };
    const upd = { vivo };
    if (pantalla.modo === 'resultado' && cid && part[cid]) {
      upd.resultado = construirResultado(cid, pantalla.revelado || {}, !!pantalla.soloPublico);
    }
    const firma = JSON.stringify(upd);
    if (firma === ultimaSync) return;
    ultimaSync = firma;
    try { await fb.update(r('pantalla'), upd); } catch (e) { ultimaSync = ''; console.warn('pantalla', e); }
  }, espera);
}

function tablaCategoria(cat) {
  const lista = partLista().filter((p) => p.categoria === cat).map((p) => ({ p, ...resultadoDe(p.id) }));
  const calificados = lista.filter((x) => !x.p.ausente && (cierres[x.p.id] || x.juradosRecibidos)).sort(compararResultados);
  const sin = lista.filter((x) => !calificados.includes(x));
  const idsJ = Object.keys(jur).sort();
  const fila = (x, i) => { const pu = puestoDe(cat, i); return `<tr class="${pu ? 'top' : ''}"><td>${i === null ? '' : pu ? `<b>${pu}.º</b>` : i + 1}</td><td>${esc(x.p.nombre)}</td>
    <td class="n">${x.nVotos}</td><td class="n">${num(x.promedio, 2)}</td>
    ${idsJ.map((j) => `<td class="n">${x.notasJ[j] !== null ? num(x.notasJ[j], 1) : '—'}</td>`).join('')}
    <td class="n">${num(x.promJurado, 2)}</td><td class="n"><b>${num(x.final, 2)}</b></td><td>${x.completo ? '<span class="chip verde">OK</span>' : '<span class="chip">parcial</span>'}</td></tr>`; };
  return { calificados, html: `<div class="tarjeta"><div class="fila"><h2 class="crece" style="margin:0">${esc(cat)}</h2>
      <button class="boton chico" data-podio="${esc(cat)}" ${calificados.length ? '' : 'disabled'}>Mostrar podio en pantalla</button>
      ${pantalla.modo === 'podio' && pantalla.podio?.categoria === cat ? `<button class="boton secundario chico" data-podio-ocultar="1" ${(pantalla.podio.revelados || 0) ? '' : 'disabled'}>◀ Ocultar último</button><button class="boton naranja chico" data-podio-rev="1" ${siguientePodio() ? '' : 'disabled'}>${siguientePodio() ? `Revelar ${siguientePodio().puesto}.º puesto · ${esc(siguientePodio().nombre)}` : 'Todos revelados'}</button>` : ''}</div>
    <div class="envoltura-tabla" style="margin-top:10px"><table class="tabla"><tr><th>Puesto</th><th>Participante</th><th class="n">Votos</th><th class="n">J5 (público)</th>
      ${idsJ.map((j) => `<th class="n">${esc(jur[j].nombre)}</th>`).join('')}<th class="n">Jurado</th><th class="n">Final</th><th></th></tr>
      ${calificados.map((x, i) => fila(x, i)).join('')}${sin.map((x) => fila(x, null)).join('')}</table></div></div>` };
}

function exportarCSV() {
  const idsJ = Object.keys(jur).sort();
  const cab = ['Categoría', 'Puesto', 'ID', 'Participante', 'Canción', 'Votos público', 'Promedio público',
    ...idsJ.map((j) => jur[j].nombre), 'Promedio jurado', 'Peso público %', 'Nota final', 'Completo'];
  const filas = [cab];
  for (const cat of CATEGORIAS) {
    const { calificados } = tablaCategoria(cat);
    const resto = partLista().filter((p) => p.categoria === cat && !calificados.find((x) => x.p.id === p.id)).map((p) => ({ p, ...resultadoDe(p.id) }));
    [...calificados.map((x, i) => [x, i + 1]), ...resto.map((x) => [x, ''])].forEach(([x, pos]) => filas.push([
      cat, pos, x.p.id, x.p.nombre, x.p.cancion || '', x.nVotos, x.promedio === null ? '' : x.promedio.toFixed(3),
      ...idsJ.map((j) => (x.notasJ[j] === null ? '' : x.notasJ[j].toFixed(1))), x.promJurado === null ? '' : x.promJurado.toFixed(3),
      x.pesoPublico, x.final === null ? '' : x.final.toFixed(2), x.completo ? 'Sí' : 'No']));
  }
  const celda = (c) => { let t = String(c); if (typeof c === 'number' || /^-?\d+\.\d+$/.test(t)) t = t.replace('.', ','); return `"${t.replace(/"/g, '""')}"`; };
  descargar('resultados-gran-final.csv', filas.map((f) => f.map(celda).join(';')).join('\r\n'));
}
function sinClaves(b) { const o = {}; Object.entries(b || {}).forEach(([n, x]) => { const { k, ...resto } = x; o[n] = resto; }); return o; }
function descargar(nombre, texto, tipo = 'text/csv;charset=utf-8') {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + texto], { type: tipo })); a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  </div>
  <div class="tarjeta" id="b-sospechosos"></div>
  <div class="tarjeta"><h3>Buscar y liberar boletas</h3>
    <p class="suave chico">Si alguien registró un número que no es suyo, o cambió de celular o de navegador, libéralo aquí y pide que lo registre de nuevo con su boleta física en la mano. Los votos que ya hizo esa boleta se conservan.</p>
    <input id="b-buscar" placeholder="Número o nombre" value="${esc(busquedaBoleta)}">
    <div class="envoltura-tabla" style="margin-top:10px" id="b-tabla"></div></div></div>`;
  app.onclick = null;

    const d = Number($('#b-desde').value), h = Number($('#b-hasta').value);
    if (!(d >= 0 && h <= 999 && h >= d)) return aviso('Rango inválido', 'error');
    const m = {}; for (let i = d; i <= h; i++) m[pad3(i)] = true;
    const fuera = Object.keys(boletas).filter((n) => !m[n]);
    await fb.set(r('boletasValidas'), m); aviso(`Rango ${pad3(d)}–${pad3(h)} aplicado${fuera.length ? ` · ⚠ ${fuera.length} boletas ya registradas quedan fuera del rango` : ''}`, fuera.length ? 'error' : 'ok', 6000); pBoletas();
  };
  $('#b-sinrango').onclick = async () => { await fb.set(r('boletasValidas'), null); aviso('Sin restricción de números'); pBoletas(); };
  pBoletasTabla();
}
function pSospechosos() {
  const box = $('#b-sospechosos'); if (!box) return;
  // acompanantes por finalista
  const porFin = {};
  Object.values(boletas).forEach((b) => { porFin[b.finalista] = (porFin[b.finalista] || 0) + 1; });
  const filas = partLista().map((p) => ({ p, n: porFin[p.id] || 0 })).sort((a, b) => b.n - a.n);
  // varias boletas desde el mismo celular (solo deberia haber una por celular)
  const porDisp = {};
  Object.entries(boletas).forEach(([n, b]) => { (porDisp[b.d] = porDisp[b.d] || []).push(n); });
  const repetidos = Object.values(porDisp).filter((l) => l.length > 1).sort((a, b) => b.length - a.length);
  box.innerHTML = `<h3>Acompañantes por finalista</h3>
    <div class="envoltura-tabla" style="max-height:260px"><table class="tabla"><tr><th>Finalista</th><th>Categoría</th><th class="n">Registrados</th></tr>
      ${filas.map((x) => `<tr><td>${esc(x.p.nombre)}</td><td class="suave chico">${esc(x.p.categoria)}</td><td class="n"><b>${x.n}</b></td></tr>`).join('')}

    <h3 style="margin-top:14px">Celulares con más de una boleta</h3>
    <p class="suave chico">La página permite una boleta por celular. Si aparece aquí un mismo celular con varias, alguien está registrando números a propósito: revisa y libera.</p>
    ${repetidos.length ? repetidos.map((l) => `<div style="margin:6px 0"><span class="chip rojo">${l.length} boletas</span> ${esc(boletas[l[0]].nombre)} · <span class="suave chico">${l.sort().join(', ')}</span></div>`).join('') : '<p class="suave chico">Ninguno.</p>'}`;
}
function pBoletasTabla() {
  pSospechosos();
  const box = $('#b-tabla'); if (!box) return;
  const t = $('#b-total'); if (t) t.textContent = nBoletas();
  const q = busquedaBoleta.trim().toLowerCase();
  const lista = Object.entries(boletas).filter(([n, b]) => !q || n.includes(q) || (b.nombre || '').toLowerCase().includes(q)).sort((a, b) => a[0].localeCompare(b[0]));
  box.innerHTML = `<table class="tabla"><tr><th>Número</th><th>Nombre</th><th>Acompaña a</th><th>Hora</th><th></th></tr>${lista.slice(0, 300).map(([n, b]) => `<tr><td><b>${n}</b></td><td>${esc(b.nombre)}</td><td class="suave chico">${esc(b.finalista === 'NINGUNO' ? 'Público general' : (part[b.finalista] || {}).nombre || '')}</td>
    <td class="mono suave">${b.t ? new Date(b.t).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }) : ''}</td><td><button class="boton secundario chico" data-liberar="${n}">Liberar</button></td></tr>`).join('')}</table>
    ${lista.length > 300 ? `<p class="suave chico">Mostrando 300 de ${lista.length}. Afina la búsqueda.</p>` : ''}${!lista.length ? '<p class="suave">Sin resultados.</p>' : ''}`;
  $$('[data-liberar]', box).forEach((b) => (b.onclick = async () => {
    const n = b.dataset.liberar; const x = boletas[n]; if (!x) return;
    if (b.dataset.confirmar !== '1') { b.dataset.confirmar = '1'; b.textContent = '¿Seguro? Liberar'; b.classList.add('rojo'); return; }
    await fb.set(r('boletas/' + n), null);
    aviso('Boleta ' + n + ' liberada');
  }));
}

function escucharVotosActual() {}

  escuchar('config', (v) => (cfg = v || {}));
  escuchar('estado', (v) => {
