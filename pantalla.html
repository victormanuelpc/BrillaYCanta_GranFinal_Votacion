<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pantalla · Brilla & Canta</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #0b0213; }
  body { background: #0b0213; }
  /* Escenario fijo 1920x1080 escalado a la pantalla */
  #escenario { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    background: radial-gradient(70% 70% at 20% 0%, #5a1a86 0%, transparent 60%), radial-gradient(60% 60% at 100% 100%, rgba(255,122,26,.45) 0%, transparent 60%), #14051f; }
  #escenario::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.5px); background-size: 46px 46px; opacity: .08; }
  .vista { position: absolute; inset: 0; padding: 70px 90px; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  .vista.activa { opacity: 1; pointer-events: auto; }
  .marca { position: absolute; left: 60px; bottom: 36px; display: flex; align-items: center; gap: 16px; opacity: .85; }
  .marca img { width: 70px; }
  .marca span { font: 700 22px var(--display); color: var(--texto-suave); letter-spacing: .06em; }
  .oro { color: var(--oro); }
  .enorme { font: 900 120px/1 var(--display); letter-spacing: .02em; }

  /* espera */
  .espera { display: grid; grid-template-columns: 1fr 640px; gap: 80px; align-items: center; height: 100%; }
  .espera .logo { width: 380px; filter: drop-shadow(0 20px 40px rgba(245,196,81,.35)); }
  .espera h1 { font: 900 110px/1 var(--display); color: var(--oro); letter-spacing: .05em; margin: 20px 0 10px; text-shadow: 0 6px 40px rgba(245,196,81,.4); }
  .espera h2 { font: 700 44px var(--display); color: #fff; }
  .caja-qr { background: #fff; border-radius: 36px; padding: 36px; text-align: center; color: #2a0f3c; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .caja-qr .qr svg { width: 470px; height: 470px; display: block; margin: 0 auto; }
  .caja-qr b { display: block; font: 800 36px var(--display); margin-top: 14px; }
  .caja-qr span { font: 600 24px var(--cuerpo); color: #6d4b86; }
  .contador { margin-top: 36px; display: inline-flex; gap: 18px; align-items: baseline; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); padding: 18px 30px; border-radius: 20px; }
  .contador b { font: 900 64px var(--display); color: var(--oro); font-variant-numeric: tabular-nums; }
  .contador span { font: 600 28px var(--cuerpo); color: var(--texto-suave); }

  /* escena */
  .escena { display: grid; grid-template-columns: 700px 1fr; gap: 80px; align-items: center; height: 100%; }
  .foto-grande { width: 700px; height: 864px; object-fit: cover; border-radius: 34px; box-shadow: 0 0 0 6px rgba(245,196,81,.75), 0 40px 90px rgba(0,0,0,.6); }
  .categoria { display: inline-block; font: 800 34px var(--display); color: #1b0b28; background: var(--oro); padding: 8px 28px; border-radius: 999px; letter-spacing: .04em; }
  .nombre-grande { font: 900 var(--tam, 118px)/1.02 var(--display); margin: 26px 0 16px; }
  .cancion { font: 600 44px var(--cuerpo); color: var(--texto-suave); }
  .panel-voto { margin-top: 48px; display: flex; gap: 36px; align-items: center; background: rgba(0,0,0,.35); border: 2px solid rgba(47,209,128,.6); border-radius: 30px; padding: 30px 36px; }
  .panel-voto.cerrado { border-color: rgba(255,255,255,.15); }
  .panel-voto .qr svg { width: 220px; height: 220px; background: #fff; border-radius: 16px; display: block; }
  .vota-ya { font: 900 64px var(--display); color: var(--verde); letter-spacing: .03em; }
  .panel-voto > div:last-child { flex: 1; min-width: 0; }
  .barra { height: 34px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; margin: 18px 0 10px; width: 100%; }
  .barra > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--verde), #a6f5c9); border-radius: 999px; transition: width .8s ease; }
  .dato-vivo { font: 700 36px var(--cuerpo); color: #fff; font-variant-numeric: tabular-nums; }

  /* resultado */
  .resultado { display: grid; grid-template-columns: 520px 1fr; gap: 80px; align-items: center; height: 100%; }
  .resultado .foto-grande { width: 520px; height: 642px; }
  .fila-nota { display: grid; grid-template-columns: 1fr 220px; align-items: center; padding: 10px 30px; border-radius: 20px; background: rgba(255,255,255,.07); margin-bottom: 10px; }
  .fila-nota .quien { font: 700 36px var(--display); }
  .fila-nota .detalle { font: 600 26px var(--cuerpo); color: var(--texto-suave); }
  .fila-nota .valor { font: 900 60px var(--display); text-align: right; font-variant-numeric: tabular-nums; }
  .valor.tapado { color: rgba(255,255,255,.18); }
  .valor.revelado { animation: aparece .7s cubic-bezier(.2,1.6,.4,1); color: var(--oro); }
  @keyframes aparece { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .final { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; padding: 18px 34px; border-radius: 26px; background: linear-gradient(135deg, rgba(245,196,81,.25), rgba(255,122,26,.2)); border: 2px solid rgba(245,196,81,.6); }
  .final .quien { font: 900 50px var(--display); letter-spacing: .06em; }
  .final .valor { font: 900 104px/1 var(--display); color: var(--oro); font-variant-numeric: tabular-nums; }

  /* cuenta regresiva para cerrar la votacion */
  .cuenta { margin-top: 14px; font: 800 38px var(--display); color: #ffb3b3; display: flex; align-items: center; gap: 18px; }
  .cuenta b { display: inline-grid; place-items: center; min-width: 110px; height: 110px; border-radius: 50%; background: #d94b50; color: #fff; font: 900 72px var(--display); box-shadow: 0 0 0 6px rgba(217,75,80,.35); }
  .cuenta b.late { animation: late .9s ease-out; }
  @keyframes late { from { transform: scale(1.35); } to { transform: none; } }
  /* podio */
  .podio-vista h1 { text-align: center; font: 900 68px var(--display); color: var(--oro); margin: 0; letter-spacing: .06em; }
  .podio-vista h2 { text-align: center; font: 700 34px var(--display); margin: 0 0 20px; color: var(--texto-suave); }
  .podio { display: flex; gap: 26px; justify-content: center; align-items: flex-end; }
  .puesto { text-align: center; opacity: 0; transform: translateY(40px); transition: all .8s cubic-bezier(.2,1.3,.4,1); width: var(--w); }
  .puesto.visible { opacity: 1; transform: none; }
  .puesto img { width: 100%; aspect-ratio: 250 / 308; object-fit: cover; border-radius: 22px; box-shadow: 0 0 0 5px var(--c), 0 30px 60px rgba(0,0,0,.5); }
  .puesto .nom { font: 800 var(--fn) var(--display); margin: 10px 0 0; line-height: 1.1; }
  .puesto .pts { font: 900 calc(var(--fn) * 1.35) var(--display); color: var(--c); }
  .puesto .det { font: 600 18px var(--cuerpo); color: var(--texto-suave); }
  .puesto .base { margin-top: 10px; border-radius: 20px 20px 0 0; background: linear-gradient(180deg, var(--c), transparent); font: 900 calc(var(--fn) * 1.9) var(--display); color: #1b0b28; padding-top: 6px; height: var(--h); }
  .pu1 { --c: #f5c451; --h: 150px; } .pu2 { --c: #d9dee8; --h: 110px; } .pu3 { --c: #e0955c; --h: 80px; } .pu4 { --c: #b99be0; --h: 55px; } .pu5 { --c: #8fc7e8; --h: 40px; }

  /* mensaje */
  .mensaje { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .mensaje img { width: 300px; margin-bottom: 30px; }
  .mensaje h1 { font: 900 100px/1.05 var(--display); color: var(--oro); max-width: 1600px; }
  .mensaje p { font: 600 48px var(--cuerpo); max-width: 1500px; color: #fff; }

  /* jurados */
  .jurados-vista h1 { text-align: center; font: 900 72px var(--display); color: var(--oro); margin: 0 0 30px; letter-spacing: .08em; }
  .tarjetas-jurado { display: grid; grid-template-columns: repeat(4, 400px); gap: 34px; justify-content: center; }
  .tarjeta-jurado { opacity: 0; transform: translateY(50px) scale(.94); transition: all .9s cubic-bezier(.2,1.3,.4,1); text-align: center; }
  .tarjeta-jurado.visible { opacity: 1; transform: none; }
  .tarjeta-jurado img { width: 400px; height: 382px; object-fit: cover; border-radius: 26px; box-shadow: 0 0 0 4px rgba(245,196,81,.7), 0 30px 60px rgba(0,0,0,.5); }
  .tarjeta-jurado div { font: 800 38px var(--display); margin-top: 18px; }
  /* artista invitada */
  .invitada-vista { height: 100%; display: grid; grid-template-columns: 760px 1fr; gap: 70px; align-items: center; }
  .invitada-vista img { width: 760px; height: 848px; object-fit: cover; border-radius: 32px; box-shadow: 0 0 0 6px rgba(245,196,81,.75), 0 40px 90px rgba(0,0,0,.6); animation: aparece .9s cubic-bezier(.2,1.3,.4,1); }
  .invitada-vista .etiqueta { display: inline-block; font: 800 36px var(--display); color: #1b0b28; background: var(--oro); padding: 8px 28px; border-radius: 999px; letter-spacing: .06em; }
  .invitada-vista .nom { font: 900 120px/1.02 var(--display); margin-top: 28px; }
  /* solo nota del publico */
  .solo-publico { margin-top: 30px; text-align: center; background: rgba(0,0,0,.35); border: 2px solid rgba(245,196,81,.6); border-radius: 34px; padding: 40px 30px; }
  .solo-publico .t { font: 800 46px var(--display); letter-spacing: .06em; }
  .solo-publico .v { font: 900 220px/1 var(--display); color: var(--oro); font-variant-numeric: tabular-nums; margin: 16px 0 6px; animation: aparece .8s cubic-bezier(.2,1.6,.4,1); }
  .solo-publico .d { font: 600 36px var(--cuerpo); color: var(--texto-suave); }
  .puesto .det { font: 600 24px var(--cuerpo); color: var(--texto-suave); margin-top: 2px; }
  #pantalla-completa { position: fixed; right: 16px; top: 16px; z-index: 50; }
  body.en-completa #pantalla-completa { display: none; }
</style>
</head>
<body>
<div id="escenario">
  <section class="vista" id="v-espera"></section>
  <section class="vista" id="v-escena"></section>
  <section class="vista" id="v-resultado"></section>
  <section class="vista" id="v-podio"></section>
  <section class="vista" id="v-mensaje"></section>
  <section class="vista" id="v-jurados"></section>
  <section class="vista" id="v-invitada"></section>
</div>
<button class="boton secundario chico" id="pantalla-completa">⛶ Pantalla completa (F)</button>

<script type="module">
import { fb, r, $, esc, num, pct, foto, URL_BASE, EVENTO, sesion, conIds } from './js/comun.js';
import { qrSVG } from './js/qr.js';

const esc_ = $('#escenario');
function ajustar() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  esc_.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', ajustar); ajustar();
const completa = () => document.documentElement.requestFullscreen?.().catch(() => {});
$('#pantalla-completa').onclick = completa;
addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') completa(); });
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('en-completa', !!document.fullscreenElement));

const URL_VOTO = URL_BASE + 'votacion.html';
const QR_GRANDE = qrSVG(URL_VOTO, { ecl: 'M', borde: 2 });
let P = {}, participantes = {}, jurados = {}, modoPrevio = '', firmas = {};

function mostrar(modo) {
  document.querySelectorAll('.vista').forEach((v) => v.classList.toggle('activa', v.id === 'v-' + modo));
}
const tamNombre = (n, base) => Math.round(base * Math.min(1, 16 / Math.max(16, String(n).length))) + 'px';
const cambio = (clave, valor) => { const j = JSON.stringify(valor); if (firmas[clave] === j) return false; firmas[clave] = j; return true; };

function vEspera() {
  const v = P.vivo || {};
  if (cambio('espera', [v.boletas])) {
    $('#v-espera').innerHTML = `<div class="espera">
      <div><img class="logo" src="img/logo-grande.webp" alt=""><h1>${esc(EVENTO.titulo)}</h1><h2>${esc(EVENTO.subtitulo)}</h2>
        <div class="contador"><b>${Number(v.boletas || 0).toLocaleString('es-CO')}</b><span>asistentes registrados</span></div></div>
      <div class="caja-qr"><div class="qr">${QR_GRANDE}</div><b>Regístrate con tu boleta</b><span>y califica a los finalistas desde tu celular</span></div>
    </div>`;
  }
}
function vEscena() {
  const p = participantes[P.cid]; if (!p) return;
  const v = P.vivo || {};
  const enCuenta = !!v.abierta && v.quedan != null;
  if (cambio('escena-base', [P.cid, p.nombre, p.cancion, p.ciudad, !!v.abierta, enCuenta])) {
    $('#v-escena').innerHTML = `<div class="escena">
      <img class="foto-grande" src="${foto(p)}" alt="">
      <div><span class="categoria">${esc(p.categoria)}</span>
        <div class="nombre-grande" style="--tam:${tamNombre(p.nombre, 118)}">${esc(p.nombre)}</div>
        <div class="cancion">${p.cancion ? '«' + esc(p.cancion) + '»' : ''}${p.ciudad ? ' · ' + esc(p.ciudad) : ''}</div>
        <div class="panel-voto ${v.abierta ? '' : 'cerrado'}" id="panel-voto">
          ${v.abierta ? `<div class="qr">${qrSVG(URL_VOTO, { borde: 2 })}</div>` : ''}
          <div><div class="${v.abierta ? 'vota-ya' : 'dato-vivo'}">${v.abierta ? '¡CALIFICA AHORA!' : 'Votación del público cerrada'}</div>
            ${enCuenta ? '<div class="cuenta">La votación se cierra en <b id="cuenta-n"></b></div>' : ''}
            <div class="dato-vivo" id="dato-vivo" style="margin-top:14px"></div></div>
        </div></div></div>`;
  }
  const cn = $('#cuenta-n'); if (cn && cn.textContent !== String(v.quedan)) { cn.textContent = v.quedan; cn.classList.remove('late'); void cn.offsetWidth; cn.classList.add('late'); }
  const d = $('#dato-vivo'); if (d) d.textContent = `${(v.votos || 0).toLocaleString('es-CO')} ${v.votos === 1 ? 'voto' : 'votos'} del público`;
}
function vResultado() {
  const p = participantes[P.cid]; if (!p) return;
  // solo se usan datos del MISMO participante (nunca los del anterior)
  const R = P.resultado && P.resultado.cid === P.cid ? P.resultado : { revelado: {}, jurados: [] };
  const rev = R.revelado || {};
  const fila = (quien, detalle, valor, ok, clave) => `<div class="fila-nota"><div><div class="quien">${quien}</div>${detalle ? `<div class="detalle">${detalle}</div>` : ''}</div>
    <div class="valor ${ok ? 'revelado' : 'tapado'}" data-k="${clave}">${ok ? num(valor, clave === 'publico' ? 2 : 1) : '?'}</div></div>`;
  const pub = R.publico || {};
  if (R.soloPublico) {
    const h = `<div class="resultado"><img class="foto-grande" src="${foto(p)}" alt="">
      <div><span class="categoria">${esc(p.categoria)}</span><div class="nombre-grande" style="--tam:${tamNombre(p.nombre, 96)};margin:16px 0 10px">${esc(p.nombre)}</div>
      <div class="solo-publico"><div class="t">CALIFICACIÓN DEL PÚBLICO</div>
        <div class="v">${pub.nota === null || pub.nota === undefined ? '—' : num(pub.nota, 2)}</div>
        <div class="d">${R.parcial ? 'Nota parcial · ' : ''}Promedio de ${Number(pub.votos || 0).toLocaleString('es-CO')} ${pub.votos === 1 ? 'voto' : 'votos'}${R.parcial ? ' · Puede cambiar hasta el cierre de las votaciones' : ''} · La nota de los jurados se conocerá en la premiación</div></div>
      </div></div>`;
    if (cambio('resultado', h)) $('#v-resultado').innerHTML = h;
    return;
  }
  const html = `<div class="resultado"><img class="foto-grande" src="${foto(p)}" alt="">
    <div><span class="categoria">${esc(p.categoria)}</span><div class="nombre-grande" style="--tam:${tamNombre(p.nombre, 76)};margin:14px 0 18px">${esc(p.nombre)}</div>
    ${fila('Público', rev.publico ? `Promedio de ${Number(pub.votos || 0).toLocaleString('es-CO')} ${pub.votos === 1 ? 'voto' : 'votos'}` : 'Calificación del público', pub.nota, !!rev.publico, 'publico')}
    ${Object.values(R.jurados || {}).map((j) => fila(esc(j.nombre), '', j.nota, j.nota !== null && j.nota !== undefined, j.id)).join('')}
    <div class="final"><div class="quien">NOTA FINAL</div><div class="valor ${rev.final ? 'revelado' : 'tapado'}">${rev.final ? num(R.final, 2) : '?'}</div></div>
    </div></div>`;
  if (cambio('resultado', html)) $('#v-resultado').innerHTML = html;
}
function vPodio() {
  const D = P.podio || {}; const lista = Object.values(D.lista || {}); const rev = Number(D.revelados || 0); const N = lista.length;
  // el mejor al centro; los demas se reparten a izquierda y derecha
  const orden = []; lista.forEach((x, k) => { if (k % 2) orden.push(k); else orden.unshift(k); });
  if (N % 2 === 0) orden.reverse();
  const ancho = N <= 3 ? 330 : N <= 5 ? 280 : 210, fn = N <= 5 ? 30 : 24;
  const base = `<div class="podio-vista"><h1>${esc(D.categoria || '')}</h1><h2>Ganadores de la categoría</h2><div class="podio">
    ${orden.map((k) => { const x = lista[k]; const p = participantes[x.id] || {}; const pu = x.puesto || k + 1;
      const w = Math.round(ancho * (pu === 1 ? 1.12 : pu === 2 ? 1 : .92));
      return `<div class="puesto pu${Math.min(pu, 5)}" data-k="${k}" style="--w:${w}px;--fn:${fn}px"><img src="${foto({ id: x.id })}" alt=""><div class="nom">${esc(p.nombre || x.nombre)}</div><div class="pts">${num(x.final, 2)}</div>${x.jurado != null ? `<div class="det">Jurados ${num(x.jurado, 2)} · Público ${num(x.publico, 2)}</div>` : ''}<div class="base">${pu}.º</div></div>`; }).join('')}
  </div></div>`;
  if (cambio('podio', base)) $('#v-podio').innerHTML = base;
  // se revela del ultimo premiado hacia el primer lugar
  document.querySelectorAll('#v-podio .puesto').forEach((el) => { const k = Number(el.dataset.k); el.classList.toggle('visible', rev >= N - k); });
}
function vMensaje() {
  const M = P.mensaje || {};
  const html = `<div class="mensaje"><img src="img/logo-grande.webp" alt=""><h1>${esc(M.titulo || '')}</h1><p>${esc(M.texto || '')}</p></div>`;
  if (cambio('mensaje', html)) $('#v-mensaje').innerHTML = html;
}

function vJurados() {
  const J = P.jurados || {}; const n = Number(J.visibles || 0);
  const lista = Object.entries(jurados).sort((a, b) => (a[1].orden || 0) - (b[1].orden || 0));
  const html = `<div class="jurados-vista"><h1>JURADO CALIFICADOR</h1><div class="tarjetas-jurado">
    ${lista.map(([id, j]) => `<div class="tarjeta-jurado" data-i="${j.orden || 0}"><img src="img/jurados/${id}.webp" alt=""><div>${esc(j.nombre)}</div></div>`).join('')}</div></div>`;
  if (cambio('jurados', html)) $('#v-jurados').innerHTML = html;
  setTimeout(() => document.querySelectorAll('.tarjeta-jurado').forEach((el) => el.classList.toggle('visible', Number(el.dataset.i) <= n)), 50);
}
function vInvitada() {
  const I = P.invitada || {};
  const html = `<div class="invitada-vista"><img src="img/invitadas/${esc(I.id || '')}.webp" alt="">
    <div><span class="etiqueta">ARTISTA INVITADA</span><div class="nom">${esc(I.nombre || '')}</div></div></div>`;
  if (cambio('invitada', html)) $('#v-invitada').innerHTML = html;
}
function pintar() {
  const modo = P.modo || 'espera';
  ({ espera: vEspera, escena: vEscena, resultado: vResultado, podio: vPodio, mensaje: vMensaje, jurados: vJurados, invitada: vInvitada }[modo] || vEspera)();
  if (modo !== modoPrevio) { modoPrevio = modo; mostrar(modo); }
}

await sesion().catch(() => {});
fb.onValue(r('participantes'), (s) => { participantes = conIds(s.val()); firmas = {}; pintar(); });
fb.onValue(r('jurados'), (s) => { jurados = s.val() || {}; firmas = {}; pintar(); });
fb.onValue(r('pantalla'), (s) => { P = s.val() || {}; pintar(); });
</script>
</body>
</html>
